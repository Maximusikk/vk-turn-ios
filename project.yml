name: Vkturn
options:
  bundleIdPrefix: com.vkturn
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    # MVP: без подписи (валидация сборки). CI включает CODE_SIGNING_ALLOWED=NO
    # для симулятора; подпись ad-hoc добавляется скриптом при появлении аккаунта.
    CODE_SIGNING_ALLOWED: "NO"
    LIBRARY_SEARCH_PATHS: "$(SRCROOT)/build/lib"
    HEADER_SEARCH_PATHS: "$(SRCROOT)/build/include"
targets:
  Vkturn:
    type: application
    platform: iOS
    sources:
      - path: Vkturn
      - path: Shared
    dependencies:
      - target: Tunnel
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vkturn.ios
        INFOPLIST_FILE: Vkturn/Info.plist
        CODE_SIGN_ENTITLEMENTS: Vkturn/Vkturn.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0
        SWIFT_EMIT_LOC_STRINGS: YES
  Tunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: Tunnel
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vkturn.ios.tunnel
        INFOPLIST_FILE: Tunnel/Info.plist
        CODE_SIGN_ENTITLEMENTS: Tunnel/Tunnel.entitlements
        SWIFT_OBJC_BRIDGING_HEADER: Tunnel/Tunnel-Bridging-Header.h
        OTHER_LDFLAGS: "$(inherited) -lvkturn -lhev-socks5-tunnel"
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0
