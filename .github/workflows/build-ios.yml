name: build-ios

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: false

      - name: Clone core (vk-turn-proxy)
        # Публичный репозиторий ядра; если станет приватным — переопредели секретом CORE_REPO_URL
        run: git clone --depth 1 "${CORE_REPO_URL:-https://github.com/cacggghp/vk-turn-proxy.git}" "$HOME/core"

      - name: Clone hev-socks5-tunnel
        run: git clone --recursive https://github.com/heiher/hev-socks5-tunnel.git "$HOME/hev"

      - name: Build core for iOS
        run: CORE_DIR="$HOME/core" bash scripts/build-core-ios.sh

      - name: Build hev for iOS
        run: HEV_DIR="$HOME/hev" bash scripts/build-hev.sh

      - name: Generate Xcode project & build
        run: IPA=1 bash scripts/build.sh

      - name: Collect build logs
        if: always()
        run: |
          mkdir -p logs
          cp -R build/*.log logs/ 2>/dev/null || true
          (cd "$HOME/core" && go version > logs/go-version.txt 2>&1 || true)

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-logs
          path: logs/

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: vkturn-ios-unsigned
          path: build/Vkturn-unsigned.ipa
