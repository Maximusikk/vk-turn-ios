name: build

on:
  push:
    branches: [product, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: false

      # Go-движок → WireGuardTURN.xcframework (Makefile сам патчит GOROOT
      # под boottime-часы и собирает c-archive для device+simulator)
      - name: Build Go bridge (xcframework)
        run: make -C WireGuardBridge all

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          cd VKTurnProxy && xcodegen generate

      - name: List schemes
        run: xcodebuild -project VKTurnProxy/VKTurnProxy.xcodeproj -list || true

      - name: Validate build (simulator)
        run: |
          set -o pipefail
          xcodebuild -project VKTurnProxy/VKTurnProxy.xcodeproj -scheme VKTurnProxy \
                 -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
                 CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build/xcodebuild-sim.log
          rc=$?
          if [ $rc -ne 0 ]; then
            { grep -E "error:" build/xcodebuild-sim.log | head -12 || true
              echo '===TAIL==='
              tail -18 build/xcodebuild-sim.log; } | while IFS= read -r line; do printf '::error::%s\n' "${line:0:280}"; done
            exit $rc
          fi

      - name: Build unsigned IPA (device)
        run: |
          set -o pipefail
          xcodebuild -project VKTurnProxy/VKTurnProxy.xcodeproj -scheme VKTurnProxy \
            -sdk iphoneos -configuration Release -archivePath build/VKTurn.xcarchive \
            CODE_SIGNING_ALLOWED=NO archive 2>&1 | tee build/xcodebuild-dev.log
          rc=$?
          if [ $rc -ne 0 ]; then
            { grep -E "error:" build/xcodebuild-dev.log | head -12 || true
              echo '===TAIL==='
              tail -18 build/xcodebuild-dev.log; } | while IFS= read -r line; do printf '::error::%s\n' "${line:0:280}"; done
            exit $rc
          fi
          mkdir -p build/Payload
          cp -R build/VKTurn.xcarchive/Products/Applications/VKTurnProxy.app build/Payload/
          (cd build && zip -qr VKTurn-unsigned.ipa Payload)

      - name: Device errors
        if: failure()
        run: grep -E "error:" build/xcodebuild-dev.log | head -25 | while IFS= read -r line; do printf '::error::%s\n' "${line:0:300}"; done

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: vkturn-ios-unsigned
          path: build/VKTurn-unsigned.ipa
